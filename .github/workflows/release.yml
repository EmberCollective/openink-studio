name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate version and extract release notes
        shell: python
        run: |
          import json, os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'\d+\.\d+\.\d+', tag), 'Invalid version tag'
          assert json.loads(pathlib.Path('desktop/package.json').read_text())['version'] == tag, 'Version differs from tag'
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          sections = re.split(r'^## ', changelog, flags=re.M)
          matching = [section for section in sections[1:] if section.splitlines()[0].startswith(tag + ' · ')]
          assert len(matching) == 1, 'Missing or duplicate changelog section'
          pathlib.Path('release-notes.md').write_text(matching[0].split('\n', 1)[1].strip() + '\n', encoding='utf-8')
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "OpenInk Studio $RELEASE_TAG" --notes-file release-notes.md --latest
          fi
